plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.odatransportation.app"
    compileSdk = 35
    // Removed explicit NDK version - will use default or installed NDK
    // ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.odatransportation.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = 35
        versionCode = 7
        versionName = flutter.versionName
        
        // Support 16 KB page size for Android 15+ devices
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            // Disabled debug symbol stripping due to incomplete NDK installation
            // ndk {
            //     debugSymbolLevel = 'FULL'
            // }
        }
    }
    
    packagingOptions {
        // Prevent stripping of debug symbols when NDK toolchain is incomplete
        doNotStrip '**/*.so'
    }
    
    // Note: 16 KB alignment for native libraries is handled by Flutter 3.24.3+
    // Native libraries built with Flutter are automatically aligned to 16 KB boundaries
    
    // Enable 16 KB page size support for native libraries
    androidResources {
        noCompress 'tflite'
        noCompress 'lite'
    }
}

flutter {
    source = "../.."
}

// Disable stripDebugSymbols task due to incomplete NDK installation
afterEvaluate {
    tasks.matching { it.name.contains("stripDebugSymbols") }.configureEach {
        enabled = false
    }
}
