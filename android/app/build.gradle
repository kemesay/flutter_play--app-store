plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // id "com.google.gms.google-services"

}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.odatransportation.app"
    // Use Flutter-managed NDK so we can pick up NDK r27+ for 16 KB page-size support
    compileSdk = 36
    ndkVersion = "28.0.12433566" 
    // if you installed NDK r28, you can use this: ndkVersion = "28.0.12433566"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.odatransportation.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 28
        targetSdk = 36
        versionCode 43

        versionName "0.4.1+7"
        
        // Support 16 KB page size for Android 15+ devices
        // Note: x86 (32-bit) is excluded as it doesn't support 16KB page sizes
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // Production release build with proper signing
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true  // Add resource shrinking for security
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Ensure native libraries are not stripped of alignment information
            ndk {
                debugSymbolLevel = 'FULL'
            }
        }
        debug {
            // Debug builds use auto-generated debug signing
            // This is NOT used for production releases
        }
    }

    // 16 KB page size support configuration
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        // Ensure native libraries maintain 16KB alignment
        resources {
            excludes += ['META-INF/*']
        }
    }

    // Ensure proper alignment for 16 KB page sizes
    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = false
        }
    }
    
    // Additional configuration for 16 KB page size support
    splits {
        abi {
            enable false
        }
    }
}

flutter {
    source '../..'
}
