name: oda_black_car_service
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.13+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  country_code_picker: ^3.0.0
  pin_code_fields: ^8.0.1
  google_maps_flutter:
  geolocator: ^7.7.1
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.1.0
  flutter_typeahead:
  uuid:
  provider:
  http:
  flutter_polyline_points:
  share_plus: ^11.1.0
  flutter_credit_card: ^4.0.1
  smooth_star_rating_null_safety:
  smooth_star_rating_nsafe: ^1.0.0+1
  device_preview: ^1.0.0
  shared_preferences: ^2.3.3
  # intl: ^0.20.2   # ✅ IMPORTANT FIX (matches Flutter SDK)
  intl: ^0.19.0 
  timezone: ^0.9.2
  cached_network_image: ^3.3.1
  collection: ^1.18.0
  url_launcher: ^6.3.0
  geolocator_android: ^2.0.0
  square_in_app_payments: ^1.7.12
  socket_io_client: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  font_awesome_flutter: 10.1.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icon.png   # ✅ lowercase, single source
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/map_style.txt
